name: Deploy Web Portal to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js Web Portal
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyC4KtUkSeeKvkEN3vZBEd_xsPvmsKdEjIc"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "privacy-display-78770.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "privacy-display-78770"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "privacy-display-78770.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "809534852793"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:809534852793:web:9d7872efd54593be3c1568"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

  deploy:
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
