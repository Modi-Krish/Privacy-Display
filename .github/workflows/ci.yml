name: REAI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Secret Scan Job ─────────────────────────────────────────────────────────
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Backend Job ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Lint, Security & Test
    runs-on: ubuntu-latest
    needs: secret-scan
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-runs-only
      GEMINI_API_KEY: fake-key-for-ci-testing-12345
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktcnVucy1vbmx5=  # gitleaks:allow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx ruff bandit pip-audit safety

      - name: Run pip-audit and safety scans
        run: |
          pip-audit
          safety check || true

      - name: Run Ruff Lint
        run: |
          ruff check backend/app

      - name: Run Bandit Static Analysis
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Pytest suite
        run: |
          cd backend
          pytest tests/ -v -s

  # ── Docker Scan Job ─────────────────────────────────────────────────────────
  docker-scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t reai-backend:latest ./backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'reai-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ── Frontend Job ────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vite production build
        run: |
          cd frontend
          npm run build
