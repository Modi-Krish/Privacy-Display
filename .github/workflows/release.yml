name: Release Application

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build-and-release:
    name: Build and Release Windows App
    runs-on: windows-latest
    permissions:
      contents: write # Needed to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Setup Backend (Python) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Python Backend Executable
        run: |
          cd backend
          echo "" > .env
          echo "{}" > firebase_service_account.json
          pyinstaller reai-backend.spec

      # ── 2. Setup Frontend (Node/Electron) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Electron App (NSIS Installer)
        run: |
          cd frontend
          npm run build:electron

      # ── 3. Publish to GitHub Releases ──
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
